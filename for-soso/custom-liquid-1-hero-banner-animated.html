<!-- CUSTOM LIQUID SECTION 1: HERO BANNER WITH ANIMATIONS -->
<!-- Placement: Home page, at the very top of the main content area (before collections) -->

<style>
  .LIQ-hero-banner {
    position: relative;
    width: 100%;
    height: 60vh;
    overflow: hidden;
    background: linear-gradient(135deg, #f5f1ed 0%, #e8dfd5 100%);
  }

  .LIQ-hero-banner__image {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
  }

  .LIQ-hero-banner__overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.25);
  }

  .LIQ-aurora {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
    background: linear-gradient(180deg, 
      rgba(180, 130, 255, 0.15) 0%,
      rgba(200, 150, 255, 0.35) 15%,
      rgba(150, 100, 255, 0.25) 35%,
      rgba(120, 80, 220, 0.1) 55%,
      transparent 75%);
    animation: LIQ-aurora 8s ease-in-out infinite;
  }

  @keyframes LIQ-aurora {
    0%, 100% {
      opacity: 0.6;
    }
    50% {
      opacity: 1;
    }
  }

  .LIQ-ocean-container {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 150px;
    background: transparent;
    z-index: 1;
    overflow: hidden;
  }

  .LIQ-ocean-canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  .LIQ-spiky-ocean-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 30px;
    background: transparent;
    z-index: 1;
    overflow: hidden;
  }

  .LIQ-spiky-ocean-canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  .LIQ-hero-banner__content {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    color: white;
    z-index: 2;
    width: 95%;
    max-width: 800px;
  }

  .LIQ-hero-banner__title {
    font-size: clamp(2rem, 8vw, 4rem);
    font-family: 'Times New Roman', Times, serif;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: capitalize;
    margin: 0;
    line-height: 1;
    text-shadow: 3px 3px 10px rgba(0, 0, 0, 0.6);
    white-space: nowrap;
    animation: LIQ-fadeInDown 0.8s ease-out 0.2s backwards;
  }

  .LIQ-hero-banner__subtitle {
    font-size: clamp(0.875rem, 2vw, 1.125rem);
    font-family: Geist, sans-serif;
    letter-spacing: 0.06em;
    margin-top: 1.5rem;
    font-weight: 700;
    text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.6);
    animation: LIQ-fadeInUp 0.8s ease-out 0.4s backwards;
    line-height: 1.6;
    max-width: 500px;
    margin-left: auto;
    margin-right: auto;
  }

  .LIQ-hero-banner__button {
    display: inline-block;
    margin-top: 2rem;
    padding: 14px 28px;
    background: #000;
    color: #fff;
    text-decoration: none;
    font-family: Geist, sans-serif;
    font-size: 0.875rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    border: none;
    cursor: pointer;
    transition: background 0.3s ease, opacity 0.3s ease;
    font-weight: 600;
    opacity: 1;
    animation: LIQ-scaleIn 0.6s ease-out 0.6s backwards;
  }

  .LIQ-hero-banner__button:hover {
    background: #333;
    opacity: 0.85;
  }

  @keyframes LIQ-fadeInDown {
    from {
      opacity: 0;
      transform: translateY(-30px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  @keyframes LIQ-fadeInUp {
    from {
      opacity: 0;
      transform: translateY(30px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  @keyframes LIQ-scaleIn {
    from {
      opacity: 0;
      transform: scale(0.95);
    }
    to {
      opacity: 1;
      transform: scale(1);
    }
  }

  @keyframes LIQ-pulse {
    0%, 100% {
      opacity: 1;
    }
    50% {
      opacity: 0.8;
    }
  }
</style>

<div class="LIQ-hero-banner">
  
  <!-- Background Image -->
  <img 
    src="https://cdn.shopify.com/s/files/1/0989/7322/1176/files/2613012_Wa10262p_1220_jpg_5ae9f5aa-08b5-44e6-9a9c-13da8b2097ad.avif?v=1777590863" 
    alt="Ketevanne's Collection" 
    class="LIQ-hero-banner__image"
  >
  
  <!-- Overlay -->
  <div class="LIQ-hero-banner__overlay"></div>

  <!-- Aurora Borealis Effect -->
  <div class="LIQ-aurora"></div>

  <!-- Spiky Ocean at Top -->
  <div class="LIQ-spiky-ocean-container">
    <canvas class="LIQ-spiky-ocean-canvas" id="LIQ-spiky-ocean-canvas"></canvas>
  </div>

  <!-- Interactive Ocean Canvas -->
  <div class="LIQ-ocean-container">
    <canvas class="LIQ-ocean-canvas" id="LIQ-ocean-canvas"></canvas>
  </div>
  
  <!-- Text Content -->
  <div class="LIQ-hero-banner__content">
    <h1 class="LIQ-hero-banner__title">
      Ketevanne's
    </h1>
    <p class="LIQ-hero-banner__subtitle">
      Fashion for the wild at heart. Curate your signature style with iconic pieces that celebrate your individuality and fearless spirit.
    </p>
    <a href="/collections/all" class="LIQ-hero-banner__button">
      Shop All Styles
    </a>
  </div>
</div>

<script>
(function() {
  const canvas = document.getElementById('LIQ-ocean-canvas');
  if (!canvas) return;
  
  const ctx = canvas.getContext('2d');
  const container = canvas.parentElement;
  
  function resizeCanvas() {
    canvas.width = container.offsetWidth;
    canvas.height = container.offsetHeight;
  }
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);
  
  const waves = [];
  const numWaves = 7;
  
  for (let i = 0; i < numWaves; i++) {
    waves.push({
      amplitude: 3 + Math.random() * 18,
      frequency: 0.003 + Math.random() * 0.003,
      phase: Math.random() * Math.PI * 2,
      speed: 0.003 + Math.random() * 0.004,
      yOffset: 0.3 + (i * 0.08),
      opacity: 0.2 + (i * 0.1)
    });
  }
  
  function drawWave(wave, time) {
    ctx.beginPath();
    ctx.moveTo(0, canvas.height);
    
    const baseY = canvas.height * wave.yOffset;
    
    for (let x = 0; x <= canvas.width; x += 2) {
      let y = baseY
        + Math.sin((x * wave.frequency) + wave.phase) * wave.amplitude
        + Math.sin((x * wave.frequency * 0.5) + wave.phase * 1.3 + time * 0.5) * (wave.amplitude * 0.4);
      
      ctx.lineTo(x, y);
    }
    
    ctx.lineTo(canvas.width, canvas.height);
    ctx.closePath();
    ctx.fillStyle = 'rgba(245, 245, 245, ' + wave.opacity + ')';
    ctx.fill();
  }
  
  let time = 0;
  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    for (let i = 0; i < waves.length; i++) {
      waves[i].phase += waves[i].speed;
      drawWave(waves[i], time);
    }
    
    time += 0.016;
    requestAnimationFrame(animate);
  }
  
  animate();
})();

(function() {
  const spikyCanvas = document.getElementById('LIQ-spiky-ocean-canvas');
  if (!spikyCanvas) return;
  
  const ctx = spikyCanvas.getContext('2d');
  const container = spikyCanvas.parentElement;
  
  function resizeCanvas() {
    spikyCanvas.width = container.offsetWidth;
    spikyCanvas.height = container.offsetHeight;
  }
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);
  
  const spikyWaves = [];
  const numSpikyWaves = 3;
  
  for (let i = 0; i < numSpikyWaves; i++) {
    spikyWaves.push({
      amplitude: 8 + Math.random() * 12,
      frequency: 0.004 + Math.random() * 0.003,
      phase: Math.random() * Math.PI * 2,
      speed: 0.004 + Math.random() * 0.005,
      yOffset: 0.3 + (i * 0.25),
      opacity: 0.3 + (i * 0.15)
    });
  }
  
  function drawSpikyWave(wave, time) {
    ctx.beginPath();
    ctx.moveTo(0, 0);
    
    const baseY = spikyCanvas.height * wave.yOffset;
    const spikeHeight = 15;
    
    for (let x = 0; x <= spikyCanvas.width; x += 8) {
      const waveY = baseY - Math.sin((x * wave.frequency) + wave.phase) * wave.amplitude;
      const spikePhase = Math.sin((x * wave.frequency * 2) + wave.phase * 0.8 + time * 0.3);
      const spike = Math.max(0, spikePhase) * spikeHeight;
      
      ctx.lineTo(x, waveY - spike);
    }
    
    ctx.lineTo(spikyCanvas.width, 0);
    ctx.closePath();
    ctx.fillStyle = 'rgba(245, 245, 245, ' + wave.opacity + ')';
    ctx.fill();
  }
  
  let spikyTime = 0;
  function animateSpiky() {
    ctx.clearRect(0, 0, spikyCanvas.width, spikyCanvas.height);
    
    for (let i = 0; i < spikyWaves.length; i++) {
      spikyWaves[i].phase += spikyWaves[i].speed;
      drawSpikyWave(spikyWaves[i], spikyTime);
    }
    
    spikyTime += 0.016;
    requestAnimationFrame(animateSpiky);
  }
  
  animateSpiky();
})();

</script>
